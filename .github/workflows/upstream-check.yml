name: Upstream check

on:
  schedule:
    - cron: '0 14 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: upstream-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Compare pinned host with the latest release
        id: versions
        shell: bash
        run: |
          set -euo pipefail
          PINNED=$(node -p "require('./package.json').dependencies['@animalabs/connectome-host'].replace(/^[^0-9]*/, '')")
          TAGS=$(npm view @animalabs/connectome-host dist-tags --json)
          LATEST=$(printf '%s' "$TAGS" | jq -r '.stable // .latest')
          echo "pinned=$PINNED" >> "$GITHUB_OUTPUT"
          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"
          if [ -z "$LATEST" ] || [ "$LATEST" = "null" ]; then
            echo "update=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$PINNED" = "$LATEST" ]; then
            echo "update=false" >> "$GITHUB_OUTPUT"
          elif [ "$(printf '%s\n%s\n' "$PINNED" "$LATEST" | sort -V | head -n1)" = "$LATEST" ]; then
            echo "update=false" >> "$GITHUB_OUTPUT"
          else
            echo "update=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update the update issue
        if: steps.versions.outputs.update == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PINNED: ${{ steps.versions.outputs.pinned }}
          LATEST: ${{ steps.versions.outputs.latest }}
        run: |
          set -euo pipefail
          BODY=$(cat <<'EOF'
          A newer `@animalabs/connectome-host` is available.

          - Pinned in `package.json`: `__PINNED__`
          - Latest on npm: `__LATEST__`
          - Changelog: https://github.com/anima-research/connectome-host/blob/v__LATEST__/CHANGELOG.md

          Checklist:

          - [ ] Review the breaking changes in the changelog.
          - [ ] Bump `@animalabs/connectome-host` and the sibling `@animalabs/*` ranges.
          - [ ] Run `bun install`, `bun run typecheck`, and `bun test`.
          - [ ] Boot the host with a `provider: "mock"` recipe.
          - [ ] Open a PR and merge only when the checks are green.
          EOF
          )
          BODY=${BODY//__PINNED__/$PINNED}
          BODY=${BODY//__LATEST__/$LATEST}
          EXISTING=$(gh issue list --state open --search 'Upstream Connectome Host update available in:title' --json number --jq '.[0].number')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
          else
            gh issue create \
              --title "Upstream Connectome Host update available: ${PINNED} -> ${LATEST}" \
              --body "$BODY"
          fi

      - name: Close the issue when upstream is back in sync
        if: steps.versions.outputs.update != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          EXISTING=$(gh issue list --state open --search 'Upstream Connectome Host update available in:title' --json number --jq '.[0].number')
          if [ -n "$EXISTING" ]; then
            gh issue close "$EXISTING" --comment "Upstream is back in sync with the pinned version. Closing automatically."
          fi
